<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Dispute Filed</title></head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
<tr><td align="center">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background-color:#b91c1c;padding:24px 32px;"><span style="color:#ffffff;font-size:18px;font-weight:bold;">Scape Data Solutions</span></td></tr>
<tr><td style="padding:32px;">
<h1 style="margin:0 0 16px;font-size:20px;color:#111827;">A dispute was filed</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#374151;">
On <strong>{{ contract.title }}</strong> — billing on this contract is now frozen until it's resolved.
</p>
<table role="presentation" width="100%" cellpadding="8" cellspacing="0" style="background-color:#f9fafb;border-radius:6px;font-size:14px;color:#374151;">
<tr><td style="color:#6b7280;">Category</td><td align="right">{{ dispute.get_category_display }}</td></tr>
</table>
<p style="margin:20px 0 0;font-size:14px;line-height:1.6;color:#374151;">{{ dispute.description|linebreaksbr }}</p>
<p style="margin:20px 0 0;font-size:13px;color:#9ca3af;">Resolve it from the admin panel as soon as possible.</p>
</td></tr>
<tr><td style="background-color:#f9fafb;padding:16px 32px;font-size:12px;color:#9ca3af;">&copy; Scape Data Solutions</td></tr>
</table></td></tr></table>
</body></html>

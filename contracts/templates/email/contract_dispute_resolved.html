<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Dispute Resolved</title></head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
<tr><td align="center">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background-color:#0f172a;padding:24px 32px;"><span style="color:#ffffff;font-size:18px;font-weight:bold;">Scape Data Solutions</span></td></tr>
<tr><td style="padding:32px;">
<h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Your dispute has been resolved</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#374151;">
On <strong>{{ contract.title }}</strong> — outcome: <strong>{{ dispute.get_status_display }}</strong>. Billing on this contract is unfrozen.
</p>
{% if dispute.resolution_note %}
<table role="presentation" width="100%" cellpadding="12" cellspacing="0" style="background-color:#f9fafb;border-radius:6px;font-size:14px;color:#374151;">
<tr><td>{{ dispute.resolution_note|linebreaksbr }}</td></tr>
</table>
{% endif %}
</td></tr>
<tr><td style="background-color:#f9fafb;padding:16px 32px;font-size:12px;color:#9ca3af;">&copy; Scape Data Solutions</td></tr>
</table></td></tr></table>
</body></html>
